# Name shown in the GitHub "Actions" tab.
name: CI

# WHEN does this workflow run?
on:
  # Every time code is pushed to develop or main (e.g. right after a merge).
  push:
    branches: [develop, main]
  # Every time a pull request is opened or updated that targets develop or main.
  pull_request:
    branches: [develop, main]
  # Adds a "Run workflow" button so it can also be started by hand.
  workflow_dispatch:

# WHAT is the workflow allowed to do?
# Read-only access to the repo code. Nothing more, which is safer if something goes wrong.
permissions:
  contents: read

# What if two runs start for the same branch?
# Group runs by branch; when a newer push arrives, cancel the older run
# so we don't waste time checking outdated code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:ci

      # Secrets are unavailable to Dependabot and fork PRs, so the scan is skipped there.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/webapp/browser/
          retention-days: 7
